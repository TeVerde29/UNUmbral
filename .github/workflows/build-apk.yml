name: Compilar APK Android (UNUmbral)

on:
  push:
    branches: [ main, desarrollo ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias npm
        run: npm install

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Construir www/ y sincronizar Capacitor Android
        run: npm run sync

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Restaurar Keystore Permanente de Firma Oficial
        env:
          KEYSTORE_BASE64: ${{ secrets.UNUMBRAL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/unumbral-release-key.jks
            echo "Keystore permanente restaurado desde Secrets."
          else
            echo "Secrets no configurado, generando keystore permanente por defecto..."
            keytool -genkeypair -v -keystore android/unumbral-release-key.jks \
              -alias unumbral -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "unumbral2026" -keypass "unumbral2026" \
              -dname "CN=UNUmbral, OU=UNU, O=TeVerde, L=Pucallpa, ST=Ucayali, C=PE"
          fi

      - name: Aceptar licencias de Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK Debug con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: UNUmbral-v1.0.1-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
